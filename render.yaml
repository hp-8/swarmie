services:
  - type: web
    name: swarmie-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements-prod.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 32 --timeout 120 wsgi:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FLASK_HOST
        value: "0.0.0.0"
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Secrets — set values in Render dashboard, do NOT commit:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL_NAME
        sync: false
      - key: LLM_FALLBACK_API_KEY
        sync: false
      - key: LLM_FALLBACK_BASE_URL
        sync: false
      - key: LLM_FALLBACK_MODEL_NAME
        sync: false
      # Paid runs (a credit was spent) use Claude via the Anthropic SDK.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PAID_MODEL_NAME
        sync: false
      - key: LLM_PAID_CHEAP_MODEL_NAME
        sync: false
      # Roast job store. Set to an Upstash Redis URL (rediss://...) so roast
      # jobs + SSE survive worker restarts/redeploys/idle spin-down. Unset →
      # in-process store (jobs lost on restart → "job not found" 404s).
      - key: REDIS_URL
        sync: false
      # Billing (credits via Stripe Checkout, ledger in Supabase).
      # BILLING_ENABLED and STRIPE_MODE are set in the Render dashboard only:
      # a hardcoded value here would reset them on every Blueprint sync.
      - key: BILLING_ENABLED
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Stripe: STRIPE_MODE (test|live) picks the key set; mismatched keys are
      # refused and other-mode webhook events ignored. Legacy single-key
      # STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET still work as a fallback.
      - key: STRIPE_MODE
        sync: false
      - key: STRIPE_SECRET_KEY_TEST
        sync: false
      - key: STRIPE_SECRET_KEY_LIVE
        sync: false
      - key: STRIPE_WEBHOOK_SECRET_TEST
        sync: false
      - key: STRIPE_WEBHOOK_SECRET_LIVE
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: APP_BASE_URL
        value: https://swarmie.harshpatadia.com
