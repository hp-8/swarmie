services:
  - type: web
    name: swarmie-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: |
      pip install --upgrade pip
      pip install uv
      uv sync --frozen
    startCommand: uv run python run.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FLASK_HOST
        value: "0.0.0.0"
      - key: FLASK_ENV
        value: production
      # Secrets — set values in Render dashboard, do NOT commit:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL_NAME
        sync: false
      - key: LLM_FALLBACK_API_KEY
        sync: false
      - key: LLM_FALLBACK_BASE_URL
        sync: false
      - key: LLM_FALLBACK_MODEL_NAME
        sync: false
