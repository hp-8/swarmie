services:
  - type: web
    name: swarmie-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements-prod.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120 wsgi:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FLASK_HOST
        value: "0.0.0.0"
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Secrets — set values in Render dashboard, do NOT commit:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL_NAME
        sync: false
      - key: LLM_FALLBACK_API_KEY
        sync: false
      - key: LLM_FALLBACK_BASE_URL
        sync: false
      - key: LLM_FALLBACK_MODEL_NAME
        sync: false
