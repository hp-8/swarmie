[project]
name = "swarmie-backend"
version = "0.1.0"
description = "Swarmie backend — founder validation via async LLM swarm"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Swarmie Team" }
]

dependencies = [
    # Core framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    "flask-limiter>=3.5.0",
    "gunicorn>=21.2.0",

    # LLM (OpenAI-format client)
    "openai>=1.0.0",

    # Deck PDF parsing
    "PyMuPDF>=1.24.0",

    # Encoding detection for non-UTF-8 text input
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",

    # Env + validation
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",

    # Roast job store (used only when REDIS_URL is set; in-memory otherwise)
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
# Coverage is a ratchet floor (current ~43%): prevents regression, raise over time.
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=40"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# app/__init__.py intentionally places imports after warnings.filterwarnings(),
# which must run before third-party imports — so E402 is expected there.
"app/__init__.py" = ["E402"]
