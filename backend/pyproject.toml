[project]
name = "swarmie-backend"
version = "2.0.0"
description = "Swarmie backend — founder validation via async LLM swarm"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [{ name = "Harsh Patadia" }]

dependencies = [
    # Core framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    "flask-limiter>=3.5.0",
    "gunicorn>=21.2.0",

    # LLM (OpenAI-format client)
    "openai>=1.0.0",
    "anthropic>=1.17.0,<2",
    "httpx>=0.27",
    "stripe>=10.0.0",

    # Deck PDF parsing
    "PyMuPDF>=1.24.0",

    # Encoding detection for non-UTF-8 text input
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",

    # Env + validation
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",

    # Roast job store (used only when REDIS_URL is set; in-memory otherwise)
    "redis>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
# Coverage is a ratchet floor (current ~43%): prevents regression, raise over time.
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=40"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    # Every LLM/PDF/callback boundary in this codebase deliberately catches
    # broad Exception + logs + falls back (one bad provider response must
    # not crash the whole swarm run). That's the architecture, not sloppiness.
    "BLE001",
    # Flagged class attrs (Config, RoastReporter and subclasses) are plain
    # class-level constants on classes that are never instantiated per-request
    # — not dataclass fields, so there's no shared-mutable-default bug here.
    "RUF012",
]

